<script>
// --------------------- AUTH UTIL ---------------------
function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

function getAuthToken() {
  const token = getCookie('admin_token');
  return token ? "Basic " + token : "";
}

function requireAuth() {
  if (!getCookie('admin_token')) {
    window.location = '/login';
  }
}

// --------------------- GENERIC ADMIN FETCH ---------------------
async function adminFetch(url, options = {}) {
  const auth = getAuthToken();
  if (!auth) {
    logout();
    return;
  }

  options.headers = {
    ...(options.headers || {}),
    "Authorization": auth,
    "Content-Type": "application/json"
  };

  const res = await fetch(url, options);

  if (res.status === 401) {
    logout();
    return;
  }

  return res;
}

// --------------------- PAGE INIT ---------------------
requireAuth();
fetchCodes();

// --------------------- ADMIN ACTIONS ---------------------
async function generate() {
  const res = await adminFetch('/api/generate', { method: 'POST' });
  if (!res) return;

  const data = await res.json();
  document.getElementById('last').innerText = data.code;
  fetchCodes();
}

async function fetchCodes() {
  const res = await adminFetch('/api/codes');
  if (!res) return;

  const data = await res.json();
  window._codes = data.codes || [];
  renderList();
}

function renderList() {
  const filter = (document.getElementById('filter').value || '').toUpperCase().trim();
  const list = window._codes || [];

  const out = list
    .filter(c => !filter || c.code.includes(filter))
    .map(c => {
      const used = c.used ? ' (USED)' : '';
      const usedAt = c.used_at ? (' - ' + c.used_at) : '';
      return `
        <div style="margin-bottom:8px">
          <span class="code">${c.code}</span>${used}${usedAt}
          <button onclick="copyCode('${c.code}')" style="margin-left:8px">Copiar</button>
        </div>`;
    })
    .join('');

  document.getElementById('list').innerHTML = out || '<i>Nenhum código</i>';
}

function copyCode(s) {
  navigator.clipboard.writeText(s);
}

// --------------------- USE (single-use) ---------------------
async function useCode() {
  const code = document.getElementById('use_code').value.trim();
  if (!code) return;

  const res = await fetch('/api/use', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code })
  });

  const data = await res.json();

  if (res.status === 200 && data.valid) {
    document.getElementById('use_msg').innerText = 'Código válido e consumido.';
    fetchCodes();
  } else {
    document.getElementById('use_msg').innerText = data.error || 'Código inválido.';
  }
}

// --------------------- INVALIDATE ---------------------
async function invalidate() {
  const code = document.getElementById('inv_code').value.trim();
  if (!code) return;

  const res = await adminFetch('/api/invalidate', {
    method: 'POST',
    body: JSON.stringify({ code })
  });

  if (!res) return;
  const data = await res.json();

  if (res.status === 200 && data.ok) {
    document.getElementById('inv_msg').innerText = 'Código invalidado.';
    fetchCodes();
  } else {
    document.getElementById('inv_msg').innerText = data.error || 'Erro.';
  }
}

// --------------------- LOGOUT ---------------------
function logout() {
  document.cookie = 'admin_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
  window.location = '/login';
}
</script>
