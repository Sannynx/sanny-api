<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { background:#071025; color:#dfefff; font-family: Inter, Arial; margin:0; padding:28px; }
    header { display:flex; justify-content:space-between; align-items:center; }
    h1 { margin:0; font-size:20px; }
    .btn { background:#3b82f6; border:none; padding:10px 12px; border-radius:8px; color:white; cursor:pointer; }
    .layout { display:flex; gap:20px; margin-top:20px; flex-wrap:wrap; }
    .card { background:#071425; padding:16px; border-radius:10px; flex:1; min-width:300px; box-shadow:0 8px 20px rgba(2,6,23,0.6); }
    .code { font-family:monospace; background:#021226; padding:8px; border-radius:6px; display:inline-block; }
    input[type=text] { padding:8px; border-radius:6px; border:1px solid #123; background:#011421; color:#dfefff; width:100%; }
  </style>
</head>
<body>
  <header>
    <h1>Painel Admin</h1>
    <div>
      <button id="genBtn" class="btn">Gerar Código</button>
      <button id="logoutBtn" class="btn">Sair</button>
    </div>
  </header>

  <div class="layout">
    <div class="card">
      <h3>Código gerado</h3>
      <div id="last" class="code">-</div>
      <h4 style="margin-top:12px">Gerenciar códigos</h4>
      <div style="margin-top:8px">
        <input id="filter" placeholder="Filtrar código..." oninput="renderList()">
      </div>
      <div id="list" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h3>Validar código (single-use)</h3>
      <div>
        <input id="use_code" placeholder="Digite o código">
        <button id="useBtn" class="btn" style="margin-top:8px">Validar & Consumir</button>
        <div id="use_msg" style="margin-top:8px"></div>
      </div>

      <h3 style="margin-top:18px">Invalidar código</h3>
      <div>
        <input id="inv_code" placeholder="Código para invalidar">
        <button id="invBtn" class="btn" style="margin-top:8px">Invalidar</button>
        <div id="inv_msg" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

<script>
async function adminFetch(path, opts = {}) {
  // cookie is HttpOnly but automatically sent by browser; no need to add headers
  if (!opts.headers) opts.headers = {};
  if (opts.body && !opts.headers['Content-Type']) opts.headers['Content-Type'] = 'application/json';
  const res = await fetch(path, opts);
  if (res.status === 401) {
    // session invalid, go to login
    window.location.href = '/login';
    return null;
  }
  return res;
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('genBtn').addEventListener('click', generate);
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('useBtn').addEventListener('click', useCode);
  document.getElementById('invBtn').addEventListener('click', invalidate);
  fetchCodes();
});

async function generate() {
  const res = await adminFetch('/api/generate', { method: 'POST' });
  if (!res) return;
  const data = await res.json();
  document.getElementById('last').innerText = data.code;
  fetchCodes();
}

async function fetchCodes() {
  const res = await adminFetch('/api/codes', { method: 'GET' });
  if (!res) return;
  const data = await res.json();
  window._codes = data.codes || [];
  renderList();
}

function renderList() {
  const filter = (document.getElementById('filter').value || '').toUpperCase().trim();
  const list = window._codes || [];
  const out = list.filter(c => !filter || c.code.includes(filter)).map(c => {
    const used = c.used ? ' (USED)' : '';
    const usedAt = c.used_at ? (' - ' + c.used_at) : '';
    return `<div style="margin-bottom:8px"><span class="code">${c.code}</span>${used}${usedAt}<button onclick="copyCode('${c.code}')" style="margin-left:8px">Copiar</button></div>`;
  }).join('');
  document.getElementById('list').innerHTML = out || '<i>Nenhum código</i>';
}

function copyCode(s) {
  navigator.clipboard.writeText(s);
}

async function useCode() {
  const code = document.getElementById('use_code').value.trim();
  if (!code) return;
  const res = await fetch('/api/use', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code }) });
  const data = await res.json();
  if (res.ok && data.valid) {
    document.getElementById('use_msg').innerText = 'Código válido e consumido.';
    fetchCodes();
  } else {
    document.getElementById('use_msg').innerText = data.error || 'Código inválido.';
  }
}

async function invalidate() {
  const code = document.getElementById('inv_code').value.trim();
  if (!code) return;
  const res = await adminFetch('/api/invalidate', { method: 'POST', body: JSON.stringify({ code }) });
  if (!res) return;
  const data = await res.json();
  if (res.ok && data.ok) {
    document.getElementById('inv_msg').innerText = 'Código invalidado.';
    fetchCodes();
  } else {
    document.getElementById('inv_msg').innerText = data.error || 'Erro.';
  }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
}
</script>
</body>
</html>
