<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { background:#0f1724; color:#e6eef8; font-family: Inter, Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .card { background:#0b1220; padding:28px; border-radius:12px; width:340px; box-shadow: 0 10px 30px rgba(2,6,23,0.6); }
    h2 { margin:0 0 16px 0; text-align:center; }
    input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #223; background:#071427; color:#e6eef8; }
    button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; background:#4a4aff; color:white; font-weight:600; cursor:pointer; }
    .msg { color:#ff6b6b; height:20px; text-align:center; margin-top:8px; }
    .small { font-size:13px; color:#9fb0c8; text-align:center; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Painel Admin</h2>
    <input id="user" placeholder="Usuário" autocomplete="username">
    <input id="pass" type="password" placeholder="Senha" autocomplete="current-password">
    <button id="btn">Entrar</button>
    <div class="msg" id="msg"></div>
    <div class="small">Usuário: <b>admin</b> — Senha: <b>admin</b></div>
  </div>

<script>
document.getElementById('btn').addEventListener('click', async () => {
  const user = document.getElementById('user').value;
  const pass = document.getElementById('pass').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ user, pass })
  });
  if (res.ok) {
    // server sets HttpOnly cookie; redirect to /admin
    window.location.href = '/admin';
  } else {
    const data = await res.json();
    document.getElementById('msg').innerText = data.error || 'Erro';
  }
});
</script>
</body>
</html>
